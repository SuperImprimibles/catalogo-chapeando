name: Sincronizar productos.js

on:
  push:
    branches:
      - main
    paths:
      # Se activa solo cuando hay cambios en las carpetas de imágenes
      - "Ilustraciones/**"
      - "Imanes/**"
      - "Letreros/**"
      - "Vintages/**"
      # O cuando editás el script manualmente
      - "sync_productos.py"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4
        with:
          # Token con permisos de escritura para poder hacer push
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Ejecutar sync_productos.py
        run: python sync_productos.py

      - name: Verificar si hubo cambios en productos.js
        id: check
        run: |
          if git diff --quiet productos.js; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Commitear y pushear productos.js actualizado
        if: steps.check.outputs.changed == 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add productos.js
          git commit -m "sync: actualizar productos.js con nuevas imágenes [skip ci]"
          git push
