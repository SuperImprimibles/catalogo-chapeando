<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>✦ Chapeando.VM — Deco & Estilo</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial,sans-serif;background:#f5f5f5;color:#222;min-height:100vh}

/* HEADER */
header{position:sticky;top:0;z-index:100;background:#fff;border-bottom:1px solid #ddd;padding:10px 20px}
.header-inner{max-width:1400px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:12px}
.logo img{height:46px;cursor:pointer}
.filters{display:flex;gap:8px;overflow-x:auto;padding:2px 0;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.filter-btn{background:#eee;border:none;padding:7px 16px;border-radius:999px;font-size:13px;cursor:pointer;white-space:nowrap;font-family:inherit}
.filter-btn:hover{background:#ddd}
.filter-btn.active{background:#111;color:#fff}
.cart-btn{background:none;border:none;font-size:22px;cursor:pointer;position:relative;padding:6px}
#cart-count{position:absolute;top:0;right:0;background:red;color:#fff;font-size:10px;width:17px;height:17px;border-radius:50%;display:none;align-items:center;justify-content:center;font-weight:700}
#cart-count.visible{display:flex}

/* GRID */
main{padding:20px;max-width:1600px;margin:0 auto}
.grid{columns:2;column-gap:12px}
@media(min-width:600px){.grid{columns:3}}
@media(min-width:900px){.grid{columns:4}}
@media(min-width:1200px){.grid{columns:5}}
.card{break-inside:avoid;margin-bottom:12px;border-radius:16px;overflow:hidden;cursor:pointer;position:relative;background:#ddd;transition:transform .2s,box-shadow .2s}
.card:hover{transform:translateY(-4px);box-shadow:0 8px 24px rgba(0,0,0,.18)}
.card img{width:100%;height:auto;display:block}
.card-overlay{position:absolute;inset:0;background:rgba(0,0,0,.45);opacity:0;transition:opacity .3s;display:flex;flex-direction:column;justify-content:space-between;padding:12px;pointer-events:none}
.card:hover .card-overlay{opacity:1;pointer-events:auto}
.card-overlay-info{flex-grow:1;display:flex;flex-direction:column;justify-content:flex-start;gap:4px}
.card-overlay-title{font-size:13px;font-weight:700;color:#fff;line-height:1.3}
.card-overlay-meta{font-size:11px;color:rgba(255,255,255,.8);display:flex;gap:8px;flex-wrap:wrap}
.card-overlay-tag{background:rgba(255,255,255,.18);backdrop-filter:blur(4px);padding:2px 8px;border-radius:999px;white-space:nowrap}
.card-overlay-btns{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:8px}
.card-btn-cart{height:36px;border-radius:999px;background:#111;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:5px;padding:0 12px;box-shadow:0 2px 8px rgba(0,0,0,.25);transition:background .15s;flex-shrink:0;color:#fff;font-size:12px;font-weight:600;font-family:inherit}
.card-btn-cart:hover{background:#333}
.card-btn-detail{background:#fff;border:none;cursor:pointer;padding:7px 14px;border-radius:999px;font-size:12px;font-weight:600;color:#111;box-shadow:0 2px 8px rgba(0,0,0,.2);transition:background .15s;white-space:nowrap}
.card-btn-detail:hover{background:#f3f3f3}

/* Perforaciones sobre ilustraciones */
.perforaciones{position:absolute;inset:0;pointer-events:none;border-radius:16px}
.perf{position:absolute;width:6px;height:6px;border-radius:50%;background:#fff;border:1px solid #bbb}
.perf-tl{top:5px;left:5px}
.perf-tr{top:5px;right:5px}
.perf-bl{bottom:5px;left:5px}
.perf-br{bottom:5px;right:5px}
#modal{display:none;position:fixed;inset:0;z-index:200;background:rgba(0,0,0,.75);align-items:center;justify-content:center;padding:12px}
.modal-box{background:#fff;border-radius:20px;width:100%;max-width:900px;max-height:92vh;overflow:hidden;display:flex;flex-direction:column;position:relative}
@media(min-width:650px){.modal-box{flex-direction:row;max-height:85vh}}
.modal-btn-close{position:absolute;top:10px;left:10px;z-index:10;width:32px;height:32px;border-radius:50%;background:rgba(0,0,0,.5);color:#fff;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center}
.modal-left{background:#111;position:relative;overflow:hidden;flex-shrink:0;width:100%;aspect-ratio:9/16}
@media(min-width:650px){.modal-left{width:auto;flex:0 0 auto;aspect-ratio:9/16;height:85vh;max-height:85vh}}
/* Galería en modal */
.gallery-track{position:relative;width:100%;height:100%}
.gallery-slide{position:absolute;inset:0;opacity:0;transition:opacity .3s ease;display:flex;align-items:center;justify-content:center}
.gallery-slide.active{opacity:1}
.gallery-slide img{max-width:42%;max-height:55%;object-fit:contain;border-radius:4px;box-shadow:4px 6px 20px rgba(0,0,0,.45),0 2px 6px rgba(0,0,0,.3);position:relative;z-index:1}
.gallery-nav{position:absolute;top:50%;transform:translateY(-50%);z-index:10;background:rgba(255,255,255,.85);border:none;cursor:pointer;width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 8px rgba(0,0,0,.2)}
.gallery-nav:hover{background:#fff}
.gallery-prev{left:8px}
.gallery-next{right:8px}
.gallery-dots{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);display:flex;gap:5px;z-index:10}
.gallery-dot{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.4);cursor:pointer;border:none;transition:background .2s;padding:0}
.gallery-dot.active{background:#fff}
.modal-right{flex:1 1 auto;padding:16px;display:flex;flex-direction:column;justify-content:space-between;overflow-y:auto;min-height:0}
.modal-cat{font-size:10px;text-transform:uppercase;font-weight:700;color:#999;background:#f3f3f3;padding:2px 8px;border-radius:999px;display:inline-block}
.modal-id{font-size:10px;color:#aaa}
.modal-title{font-size:16px;font-weight:700;margin:6px 0 10px}

/* Specs compactos */
.specs{display:flex;flex-direction:column;gap:5px;margin-bottom:12px}
.spec{display:flex;align-items:center;gap:8px;padding:6px 10px;border-radius:8px;background:#f8f8f8;border:1px solid #eee}
.spec-icon{width:26px;height:26px;display:flex;align-items:center;justify-content:center;border-radius:6px;flex-shrink:0}
.spec-label{font-size:9px;text-transform:uppercase;font-weight:700;color:#aaa;line-height:1}
.spec-val{font-size:12px;font-weight:600;color:#222;line-height:1.2}

/* Botones */
.modal-actions{display:flex;flex-direction:column;gap:8px}
.btn{width:100%;border:none;padding:11px;border-radius:12px;font-size:13px;font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:7px;font-family:inherit}
.btn-gray{background:#eee;color:#111}
.btn-gray:hover{background:#ddd}
.btn-green{background:#25d366;color:#fff}
.btn-green:hover{background:#1ebe5a}

/* CARRITO */
#cart-drawer{display:none;position:fixed;inset:0;z-index:200}
#cart-drawer.open{display:block}
#cart-bg{position:absolute;inset:0;background:rgba(0,0,0,.5)}
#cart-panel{position:absolute;top:0;right:0;width:100%;max-width:400px;height:100%;background:#fff;display:flex;flex-direction:column;box-shadow:-4px 0 20px rgba(0,0,0,.15)}
.cart-head{padding:18px 20px;border-bottom:1px solid #eee;display:flex;justify-content:space-between;align-items:center}
.cart-head h3{font-size:16px;font-weight:700}
.cart-xbtn{background:none;border:none;font-size:20px;cursor:pointer;color:#999}
#cart-items{flex-grow:1;padding:16px 20px;overflow-y:auto}
.cart-foot{padding:16px 20px;border-top:1px solid #eee;background:#f9f9f9}
.cart-tot{display:flex;justify-content:space-between;font-size:13px;color:#777;margin-bottom:12px}
.cart-tot span:last-child{font-weight:700;color:#111}
.cart-item{display:flex;gap:10px;align-items:center;background:#f8f8f8;border:1px solid #eee;border-radius:12px;padding:9px;margin-bottom:8px}
.cart-item img{width:54px;height:54px;object-fit:cover;border-radius:8px;flex-shrink:0}
.ci-info{flex-grow:1;min-width:0}
.ci-title{font-size:12px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ci-sub{font-size:11px;color:#aaa}
.ci-qty{display:flex;align-items:center;gap:5px;margin-top:5px}
.qbtn{width:22px;height:22px;border-radius:5px;background:#fff;border:1px solid #ddd;font-size:14px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center}
.qnum{font-size:12px;font-weight:700;min-width:14px;text-align:center}
.ci-del{background:none;border:none;cursor:pointer;font-size:14px;color:#ccc;padding:4px}
.ci-del:hover{color:red}
.empty-cart{text-align:center;padding:40px 0;color:#aaa;font-size:13px}
.empty-cart div{font-size:32px;margin-bottom:8px}

/* TOAST */
#toast{position:fixed;bottom:20px;right:20px;z-index:300;background:#111;color:#fff;padding:11px 18px;border-radius:12px;font-size:13px;display:flex;align-items:center;gap:8px;transform:translateY(60px);opacity:0;transition:all .3s;pointer-events:none}
#toast.show{transform:translateY(0);opacity:1}
</style>
</head>
<body>

<header>
  <div class="header-inner">
    <div class="logo" onclick="filter('all',null)">
      <img src="logo.png" alt="Chapeando">
    </div>
    <div class="filters">
      <button class="filter-btn active" onclick="filter('all',this)">Todos</button>
      <button class="filter-btn" onclick="filter('ilustraciones',this)">Ilustraciones</button>
      <button class="filter-btn" onclick="filter('imanes',this)">Imanes</button>
      <button class="filter-btn" onclick="filter('letreros',this)">Letreros</button>
      <button class="filter-btn" onclick="filter('vintages',this)">Vintages</button>
    </div>
    <button class="cart-btn" onclick="openCart()"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2L3 6v14a2 2 0 002 2h14a2 2 0 002-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 01-8 0"/></svg><span id="cart-count">0</span></button>
  </div>
</header>

<main>
  <div id="grid" class="grid"></div>
</main>

<!-- MODAL -->
<div id="modal" onclick="closeModal()">
  <div class="modal-box" onclick="event.stopPropagation()">
    <button class="modal-btn-close" onclick="closeModal()">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
    </button>
    <div class="modal-left">
      <div class="gallery-track" id="gallery-track">
        <!-- slides se generan dinámicamente -->
      </div>
      <button class="gallery-nav gallery-prev" onclick="galleryNav(-1)">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#111" stroke-width="2.5" stroke-linecap="round"><polyline points="15 18 9 12 15 6"/></svg>
      </button>
      <button class="gallery-nav gallery-next" onclick="galleryNav(1)">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#111" stroke-width="2.5" stroke-linecap="round"><polyline points="9 18 15 12 9 6"/></svg>
      </button>
      <div class="gallery-dots" id="gallery-dots"></div>
    </div>
    <div class="modal-right">
      <div>
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px">
          <span id="m-cat" class="modal-cat"></span>
          <span id="m-id" class="modal-id"></span>
        </div>
        <div id="m-title" class="modal-title"></div>

        <div class="specs">
          <div class="spec">
            <div class="spec-icon" style="background:#eff6ff"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#3b82f6" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 21H3"/><path d="M21 3v18"/><path d="M3 21L21 3"/></svg></div>
            <div><div class="spec-label">Tamaño</div><div id="m-size" class="spec-val"></div></div>
          </div>
          <div class="spec">
            <div class="spec-icon" style="background:#fffbeb"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#d97706" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="7" width="20" height="14" rx="2"/><path d="M16 7V5a2 2 0 00-4 0v2"/><path d="M8 7V5a2 2 0 00-4 0v2"/></svg></div>
            <div><div class="spec-label">Material</div><div id="m-mat" class="spec-val"></div></div>
          </div>
          <div class="spec">
            <div class="spec-icon" style="background:#f0fdf4"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#16a34a" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 16V8a2 2 0 00-1-1.73l-7-4a2 2 0 00-2 0l-7 4A2 2 0 003 8v8a2 2 0 001 1.73l7 4a2 2 0 002 0l7-4A2 2 0 0021 16z"/></svg></div>
            <div><div class="spec-label">Unidad</div><div id="m-unit" class="spec-val"></div></div>
          </div>
          <div class="spec">
            <div class="spec-icon" style="background:#f5f3ff"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#7c3aed" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="5" cy="5" r="1.5"/><circle cx="19" cy="5" r="1.5"/><circle cx="5" cy="19" r="1.5"/><circle cx="19" cy="19" r="1.5"/></svg></div>
            <div><div class="spec-label">Perforaciones</div><div class="spec-val">4 (una por esquina)</div></div>
          </div>
          <div id="price-row" class="spec" style="background:#111;border-color:#111">            <div class="spec-icon"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 000 7h5a3.5 3.5 0 010 7H6"/></svg></div>
            <div><div class="spec-label" style="color:#666">Precio</div><div id="m-price" class="spec-val" style="font-size:18px;font-weight:700;color:#fff"></div></div>
          </div>
        </div>
      </div>
      <div class="modal-actions">
        <button class="btn btn-gray" onclick="addCart()"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 002 1.61h9.72a2 2 0 002-1.61L23 6H6"/></svg> Agregar al carrito</button>

      </div>
    </div>
  </div>
</div>

<!-- CARRITO -->
<div id="cart-drawer">
  <div id="cart-bg" onclick="closeCart()"></div>
  <div id="cart-panel">
    <div class="cart-head">
      <h3><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:middle;margin-right:6px"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 002 1.61h9.72a2 2 0 002-1.61L23 6H6"/></svg>Carrito de Compras</h3>

    </div>
    <div id="cart-items"></div>
    <div class="cart-foot">
      <button class="btn btn-green" onclick="waCart()"><svg width="18" height="18" viewBox="0 0 24 24" fill="#fff"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347z"/><path d="M12 2C6.477 2 2 6.477 2 12c0 1.89.525 3.66 1.438 5.168L2 22l4.978-1.306A9.943 9.943 0 0012 22c5.523 0 10-4.477 10-10S17.523 2 12 2zm0 18a7.952 7.952 0 01-4.049-1.106l-.29-.173-3.005.788.803-2.927-.19-.302A7.952 7.952 0 014 12c0-4.411 3.589-8 8-8s8 3.589 8 8-3.589 8-8 8z"/></svg> Enviar por WhatsApp</button>
    </div>

</div>

<!-- TOAST -->
<div id="toast"><span style="color:#4ade80"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg></span><span id="toast-msg"></span></div>

<!-- Datos de productos (editá productos.js para cambiar nombres, precios y tamaños) -->

<script>
const WA = "5492657640076";
const SITE = "https://superimprimibles.github.io/catalogo-chapeando";

// Fondos aleatorios para el modal
var fondos = {
  ilustraciones: [
    { img:'Fondos/Ilustraciones/fondo-barro-mate.jpg',  pos:'center', ix:'60%', iy:'35%' },
    { img:'Fondos/Ilustraciones/fondo-gris-liso.jpg',   pos:'center', ix:'50%', iy:'50%' },
    { img:'Fondos/Ilustraciones/fondo-madera-rustica.jpg', pos:'center', ix:'50%', iy:'50%' },
    { img:'Fondos/Ilustraciones/fondo-beige.jpg',       pos:'15% center', ix:'55%', iy:'40%' },
    { img:'Fondos/Ilustraciones/fondo-pampas.jpg',      pos:'5% 70%',     ix:'65%', iy:'20%' },
    { img:'Fondos/Ilustraciones/fondo-pared-beige.jpg', pos:'center 80%', ix:'65%', iy:'40%' },
    { img:'Fondos/Ilustraciones/fondo-texturas.jpg',    pos:'center',     ix:'50%', iy:'50%' },
  ],
  vintages: [
    { img:'Fondos/Vintage/fondo-ladrillo-calido.jpg',   pos:'center',     ix:'50%', iy:'45%' },
    { img:'Fondos/Vintage/fondo-pared-rustica.jpg',     pos:'center',     ix:'40%', iy:'40%' },
    { img:'Fondos/Vintage/fondo-02.jpg',                pos:'center',     ix:'50%', iy:'50%' },
    { img:'Fondos/Vintage/fondo-05.jpg',                pos:'55% center', ix:'50%', iy:'65%' },
    { img:'Fondos/Vintage/fondo-06.jpg',                pos:'center',     ix:'50%', iy:'50%' },
  ],
  letreros: [
    { img:'Fondos/Vintage/fondo-ladrillo-calido.jpg',   pos:'center',     ix:'50%', iy:'45%' },
    { img:'Fondos/Vintage/fondo-pared-rustica.jpg',     pos:'center',     ix:'40%', iy:'40%' },
    { img:'Fondos/Ilustraciones/fondo-gris-liso.jpg',   pos:'center',     ix:'50%', iy:'50%' },
    { img:'Fondos/Ilustraciones/fondo-madera-rustica.jpg', pos:'center',  ix:'50%', iy:'50%' },
  ],
  imanes: [
    { img:'Fondos/Ilustraciones/fondo-barro-mate.jpg',  pos:'center',     ix:'60%', iy:'35%' },
    { img:'Fondos/Ilustraciones/fondo-pared-beige.jpg', pos:'center 80%', ix:'65%', iy:'40%' },
    { img:'Fondos/Ilustraciones/fondo-gris-liso.jpg',   pos:'center',     ix:'50%', iy:'50%' },
  ],
};

function fondoAleatorio(cat) {
  var lista = fondos[cat] || fondos.ilustraciones;
  return lista[Math.floor(Math.random() * lista.length)];
}
var cart = [];

// Restaurar carrito desde localStorage

function quickWa(id) {
  var item = items.find(function(x) { return x.id === id; });
  if (!item) return;
  var t = '¡Hola! Me interesa:\n\n'
    + '*' + item.title + '*\n'
    + '📐 Tamaño: ' + (item._calcSize || item.size) + '\n'
    + '💲 Precio: ' + item.price + '\n'
    + '🧱 Material: ' + item.mat + '\n\n'
    + '¿Me podés brindar más información?';
  window.open('https://wa.me/' + WA + '?text=' + encodeURIComponent(t), '_blank');
}

function quickAddCart(id) {
  var item = items.find(function(x) { return x.id === id; });
  if (!item) return;
  var i = cart.findIndex(function(x) { return x.key === item.id; });
  if (i > -1) cart[i].qty++;
  else cart.push({ key:item.id, id:item.id, title:item.title, img:item.img, size:item.size, price:item.price, qty:1 });
  saveCart();
  renderCart();
  toast('"' + item.title + '" agregado');
}

function addCart() {
  if (!current) return;
  var key = current.id;
  var i = cart.findIndex(function(x) { return x.key === key; });
  if (i > -1) cart[i].qty++;
  else cart.push({ key:key, id:current.id, title:current.title, img:current.img, size:current.size, price:current.price, qty:1 });
  saveCart();
  renderCart();
  toast('"' + current.title + '" agregado');
}

function waProduct() {
  if (!current) return;
  var t = '¡Hola! Me interesa:\n\n'
    + '*' + current.title + '*\n'
    + '📐 Tamaño: ' + (current._calcSize || current.size) + '\n'
    + '💲 Precio: ' + current.price + '\n'
    + '🧱 Material: ' + current.mat + '\n\n'
    + '¿Me podés brindar más información?';
  window.open('https://wa.me/' + WA + '?text=' + encodeURIComponent(t), '_blank');
}

function renderCart() {
  var badge = document.getElementById('cart-count');
  var box = document.getElementById('cart-items');
  var qty = cart.reduce(function(a, i) { return a + i.qty; }, 0);
  badge.textContent = qty;
  badge.className = qty > 0 ? 'visible' : '';
  if (!cart.length) {
    box.innerHTML = '<div class="empty-cart"><div>📭</div><p>Tu pedido está vacío</p></div>';
    return;
  }
  box.innerHTML = '';
  cart.forEach(function(item) {
    var el = document.createElement('div');
    el.className = 'cart-item';
    el.innerHTML = '<img src="' + item.img + '" alt="' + item.title + '">'
      + '<div class="ci-info">'
      + '<div class="ci-title">' + item.title + '</div>'
      + '<div class="ci-sub">' + item.size + ' — ' + item.price + '</div>'
      + '<div class="ci-qty">'
      + '<button class="qbtn" onclick="chQty(\'' + item.key + '\',-1)">−</button>'
      + '<span class="qnum">' + item.qty + '</span>'
      + '<button class="qbtn" onclick="chQty(\'' + item.key + '\',1)">+</button>'
      + '</div></div>'
      + '<button class="ci-del" onclick="delItem(\'' + item.key + '\')">🗑️</button>';
    box.appendChild(el);
  });
}

function chQty(key, d) {
  var i = cart.findIndex(function(x) { return x.key === key; });
  if (i > -1) { cart[i].qty += d; if (cart[i].qty <= 0) cart.splice(i, 1); saveCart(); renderCart(); }
}

function delItem(key) { cart = cart.filter(function(x) { return x.key !== key; }); saveCart(); renderCart(); }

function waCart() {
  if (!cart.length) { toast('El carrito está vacío'); return; }
  var t = '¡Hola! Mi pedido:\n\n';
  cart.forEach(function(item, i) {
    t += (i+1) + '. *' + item.title + '*\n'
      + '   📐 ' + item.size + '\n'
      + '   💲 ' + item.price + '\n'
      + '   Cantidad: ' + item.qty + '\n\n';
  });
  t += '¡Muchas gracias!';
  window.open('https://wa.me/' + WA + '?text=' + encodeURIComponent(t), '_blank');
}

function openCart() { document.getElementById('cart-drawer').className = 'open'; document.body.style.overflow = 'hidden'; renderCart(); }
function closeCart() { document.getElementById('cart-drawer').className = ''; document.body.style.overflow = ''; }

function clearCart() {
  if (!cart.length) return;
  cart = [];
  saveCart();
  renderCart();
  toast('Carrito vaciado');
}

function toast(msg) {
  var t = document.getElementById('toast');
  document.getElementById('toast-msg').textContent = msg;
  t.className = 'show';
  setTimeout(function() { t.className = ''; }, 3000);
}

// ── GALERÍA ──────────────────────────────────────────────────
var gallerySlides = [];
var galleryIndex = 0;
// Extensiones soportadas
var IMG_EXTS = ['jpg','jpeg','png','webp','gif'];

// Genera lista de posibles rutas para un producto
function getGalleryImages(item) {
  var list = [];
  // Primero la imagen principal del producto
  list.push({ src: item.img, perfs: item.cat === 'ilustraciones', fondo: fondoAleatorio(item.cat) });
  // Luego busca imágenes en Galeria/[ID]/
  // Como no podemos leer directorios desde el browser, intentamos cargar
  // nombres predecibles: 01.jpg, 02.jpg ... 10.jpg, 01.png ... etc
  var base = 'Galeria/' + item.id + '/';
  for (var n = 1; n <= 20; n++) {
    var num = n < 10 ? '0' + n : '' + n;
    IMG_EXTS.forEach(function(ext) {
      list.push({ src: base + num + '.' + ext, perfs: false, fondo: fondoAleatorio(item.cat), lazy: true });
    });
  }
  return list;
}

function buildGallery(item) {
  var track = document.getElementById('gallery-track');
  var dots = document.getElementById('gallery-dots');
  track.innerHTML = '';
  dots.innerHTML = '';
  gallerySlides = [];
  galleryIndex = 0;

  // Siempre carga la imagen principal primero
  var mainFondo = fondoAleatorio(item.cat);
  addSlide(item.img, item, mainFondo, true);

  // Luego carga las imágenes de Galeria/[ID]/ probando nombres
  var base = 'Galeria/' + item.id + '/';
  var attempted = 0;
  var maxAttempts = 20;

  function tryNext(n, extIdx) {
    if (n > maxAttempts) return;
    var ext = IMG_EXTS[extIdx];
    var num = n < 10 ? '0' + n : '' + n;
    var src = base + num + '.' + ext;
    var testImg = new Image();
    testImg.onload = function() {
      addSlide(src, item, fondoAleatorio(item.cat), false);
      // Intentar siguiente extensión y número
      var nextExt = extIdx + 1;
      if (nextExt < IMG_EXTS.length) tryNext(n, nextExt);
      else tryNext(n + 1, 0);
    };
    testImg.onerror = function() {
      var nextExt = extIdx + 1;
      if (nextExt < IMG_EXTS.length) tryNext(n, nextExt);
      else tryNext(n + 1, 0);
    };
    testImg.src = src;
  }
  tryNext(1, 0);
}

function addSlide(src, item, fondo, isMain) {
  var track = document.getElementById('gallery-track');
  var dots = document.getElementById('gallery-dots');
  var idx = gallerySlides.length;

  var slide = document.createElement('div');
  slide.className = 'gallery-slide' + (idx === 0 ? ' active' : '');

  // Fondo
  if (fondo) {
    slide.style.backgroundImage = 'url(' + fondo.img + ')';
    slide.style.backgroundSize = 'cover';
    slide.style.backgroundPosition = fondo.pos;
  } else {
    slide.style.background = '#111';
  }

  // Wrapper imagen con perforaciones si aplica
  var wrap = document.createElement('div');
  wrap.style.cssText = 'position:absolute;z-index:1;transform:translate(-50%,-50%);max-width:42%;max-height:55%';
  if (fondo) { wrap.style.left = fondo.ix; wrap.style.top = fondo.iy; }
  else { wrap.style.left = '50%'; wrap.style.top = '50%'; }

  var img = document.createElement('img');
  img.src = src;
  img.alt = item.title;
  img.style.cssText = 'display:block;max-width:100%;max-height:100%;border-radius:4px;box-shadow:4px 6px 20px rgba(0,0,0,.45)';
  wrap.appendChild(img);

  // Perforaciones solo en ilustraciones y solo en la imagen principal
  if (item.cat === 'ilustraciones' && isMain) {
    var perfs = document.createElement('div');
    perfs.style.cssText = 'position:absolute;inset:0;pointer-events:none';
    perfs.innerHTML = '<div class="perf perf-tl"></div><div class="perf perf-tr"></div><div class="perf perf-bl"></div><div class="perf perf-br"></div>';
    wrap.appendChild(perfs);
  }

  slide.appendChild(wrap);
  track.appendChild(slide);
  gallerySlides.push(slide);

  // Dot
  var dot = document.createElement('button');
  dot.className = 'gallery-dot' + (idx === 0 ? ' active' : '');
  dot.onclick = (function(i){ return function(e){ e.stopPropagation(); goToSlide(i); }; })(idx);
  dots.appendChild(dot);

  // Ocultar nav si solo hay 1 slide
  var navBtns = document.querySelectorAll('.gallery-nav');
  navBtns.forEach(function(b){ b.style.display = gallerySlides.length > 1 ? 'flex' : 'none'; });
  dots.style.display = gallerySlides.length > 1 ? 'flex' : 'none';
}

function goToSlide(idx) {
  gallerySlides.forEach(function(s, i) {
    s.classList.toggle('active', i === idx);
  });
  document.querySelectorAll('.gallery-dot').forEach(function(d, i) {
    d.classList.toggle('active', i === idx);
  });
  galleryIndex = idx;
}

function galleryNav(dir) {
  if (!gallerySlides.length) return;
  var next = (galleryIndex + dir + gallerySlides.length) % gallerySlides.length;
  goToSlide(next);
}

// Tabla de precios según área calculada
function calcPrecio(wCm, hCm) {
  var area = wCm * hCm;
  if (area <= 95)  return '$4.000';
  if (area <= 270) return '$5.000';
  return '$8.000';
}

// Precalcular tamaños de ilustraciones y vintages antes de renderizar
function precalcTamanios(lista, done) {
  var pendientes = lista.filter(function(i) {
    return (i.cat === 'ilustraciones' || i.cat === 'vintages' || i.cat === 'imanes') && i.size === '-';
  });
  if (!pendientes.length) { done(); return; }
  var restantes = pendientes.length;
  pendientes.forEach(function(item) {
    var img = new Image();
    img.onload = function() {
      var pw = img.naturalWidth, ph = img.naturalHeight;
      if (pw && ph) {
        var maxW = PRINT_W_MM;
        var maxH = item.cat === 'imanes' ? 80 : PRINT_H_MM; // imanes: max 8cm alto
        var escala = Math.min(maxW / pw, maxH / ph);
        var wMm = pw * escala, hMm = ph * escala;
        if (wMm < MIN_MM || hMm < MIN_MM) {
          var em = Math.max(MIN_MM / wMm, MIN_MM / hMm);
          wMm *= em; hMm *= em;
        }
        item._calcSize = (Math.round(wMm/10*10)/10) + ' x ' + (Math.round(hMm/10*10)/10) + ' cm';
        item._calcPrice = calcPrecio(Math.round(wMm/10*10)/10, Math.round(hMm/10*10)/10);
      }
      if (--restantes === 0) done();
    };
    img.onerror = function() { if (--restantes === 0) done(); };
    img.src = item.img;
  });
}

// Renderizar inmediatamente sin precalcular
render(items);
renderCart();
